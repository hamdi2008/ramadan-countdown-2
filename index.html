<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramadan Countdown</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f5ecd7;
      background: radial-gradient(ellipse at top, #1d2b53 0%, #0b1026 60%, #05070f 100%);
      text-align: center;
    }

    .moon {
      font-size: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 18px rgba(255, 215, 120, 0.6));
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      letter-spacing: 1px;
      color: #ffd778;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 720px;
    }

    .unit {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 215, 120, 0.35);
      border-radius: 14px;
      padding: 20px 6px;
      backdrop-filter: blur(4px);
    }

    .value {
      display: block;
      font-size: clamp(1.75rem, 6vw, 3rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .label {
      display: block;
      margin-top: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffd778;
    }

    .message {
      margin-top: 40px;
      font-size: 1.4rem;
      color: #ffd778;
    }

    .note {
      margin-top: 32px;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    @media (max-width: 520px) {
      .countdown { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="moon">🌙</div>
  <h1>Ramadan Countdown</h1>
  <p class="subtitle">Ramadan 1448 is expected to begin on the evening of Sunday, February 7, 2027</p>

  <div class="countdown" id="countdown">
    <div class="unit"><span class="value" id="months">0</span><span class="label">Months</span></div>
    <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
    <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
    <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
  </div>

  <p class="message" id="message" hidden>Ramadan Mubarak! 🌙</p>
  <p class="note">Counting down to 6:00 PM (your local time). Actual start depends on the moon sighting.</p>

  <script>
    // Evening of Sunday, February 7, 2027 at 6:00 PM local time
    const target = new Date(2027, 1, 7, 18, 0, 0);

    const els = {
      months: document.getElementById("months"),
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
    };

    const pad = (n) => String(n).padStart(2, "0");

    function addMonths(date, n) {
      const d = new Date(date);
      const day = d.getDate();
      d.setMonth(d.getMonth() + n);
      // Clamp to the last day of the month (e.g. Jan 31 + 1 month -> Feb 28)
      if (d.getDate() !== day) d.setDate(0);
      return d;
    }

    function update() {
      const now = new Date();

      if (now >= target) {
        document.getElementById("countdown").hidden = true;
        document.getElementById("message").hidden = false;
        clearInterval(timer);
        return;
      }

      // Count whole calendar months first, then the remainder
      let months = 0;
      while (addMonths(now, months + 1) <= target) months++;
      let diff = target - addMonths(now, months);

      const days = Math.floor(diff / 86400000);
      diff -= days * 86400000;
      const hours = Math.floor(diff / 3600000);
      diff -= hours * 3600000;
      const minutes = Math.floor(diff / 60000);
      diff -= minutes * 60000;
      const seconds = Math.floor(diff / 1000);

      els.months.textContent = months;
      els.days.textContent = days;
      els.hours.textContent = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);
    }

    const timer = setInterval(update, 1000);
    update();
  </script>
</body>
</html>
